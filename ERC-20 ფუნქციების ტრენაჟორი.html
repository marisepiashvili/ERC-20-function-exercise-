<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ERC-20 ფუნქციების ტრენაჟორი</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@600;700&display=swap">
<style>
/* Layout: one working column, like a block explorer's contract page. Function names are mono
   chips coloured by kind (read / write / event / guard); everything around them stays quiet. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#E2E7F0; --ink:#121A2E; --muted:#56617A; --line:#C8D0DE;
  --accent:#2740C8; --accent-ink:#FFFFFF; --accent-soft:#E1E6FB;
  --view:#0B6F6B; --view-bg:#DCF0EE;
  --write:#A84300; --write-bg:#FBE7D6;
  --event:#63359E; --event-bg:#ECE3F8;
  --guard:#6E5800; --guard-bg:#F4ECC6;
  --good:#1C7335; --good-bg:#DDF2E2; --bad:#B3261E; --bad-bg:#FBE1DF;
  --display:"Noto Serif Georgian","Noto Serif",Georgia,serif;
  --body:"Noto Sans Georgian","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","Noto Sans Georgian",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320; --surface:#171E30; --surface-2:#222C45; --ink:#E7EBF5; --muted:#9BA6BF; --line:#2F3A57;
    --accent:#93A5FF; --accent-ink:#0E1320; --accent-soft:#232C52;
    --view:#62D2CA; --view-bg:#12383A;
    --write:#FFAA6B; --write-bg:#40260F;
    --event:#C6A6F7; --event-bg:#2D2146;
    --guard:#E4C75F; --guard-bg:#3A3212;
    --good:#72D38F; --good-bg:#153522; --bad:#FF8F85; --bad-bg:#45191A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#171E30; --surface-2:#222C45; --ink:#E7EBF5; --muted:#9BA6BF; --line:#2F3A57;
  --accent:#93A5FF; --accent-ink:#0E1320; --accent-soft:#232C52;
  --view:#62D2CA; --view-bg:#12383A;
  --write:#FFAA6B; --write-bg:#40260F;
  --event:#C6A6F7; --event-bg:#2D2146;
  --guard:#E4C75F; --guard-bg:#3A3212;
  --good:#72D38F; --good-bg:#153522; --bad:#FF8F85; --bad-bg:#45191A;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin-inline:auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p,ul,ol,dl,dd,table{margin:0}
button,select,input{font:inherit;color:inherit}
code,pre{font-family:var(--mono);font-size:.92em}
p code,li code,dd code,span code,button code,h2 code,td code{overflow-wrap:anywhere;background:var(--surface-2);padding:1px 5px;border-radius:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-size:13px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,32px);line-height:1.2;text-wrap:balance}
.meter{display:flex;flex-direction:column;gap:6px;min-width:190px;font-size:13px;color:var(--muted)}
.meter b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* level chips */
.levels{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:baseline;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.chip small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}

/* mode tabs */
.modes-scroll{overflow-x:auto;border-bottom:1px solid var(--line)}
.modes{display:flex;gap:4px;min-width:max-content}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.hint{font-size:14px;color:var(--muted);max-width:65ch}

/* stage */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ref{font-size:13px;color:var(--muted)}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;line-height:1.5;white-space:nowrap}
.k-view{color:var(--view)} .k-write{color:var(--write)} .k-event{color:var(--event)} .k-guard{color:var(--guard)}
.pill.k-view{background:var(--view-bg)} .pill.k-write{background:var(--write-bg)} .pill.k-event{background:var(--event-bg)} .pill.k-guard{background:var(--guard-bg)}
.fn{font-family:var(--mono);font-weight:600;overflow-wrap:anywhere}

.btn{padding:10px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}

/* flashcard */
.card-name{font-family:var(--mono);font-weight:600;font-size:clamp(19px,4.6vw,26px);line-height:1.35;overflow-wrap:anywhere}
.ask{color:var(--muted);max-width:60ch}
.facts{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:10px 18px;border-top:1px solid var(--line);padding-top:16px}
.facts dt{font-size:13px;color:var(--muted);padding-top:2px}
.facts dd{min-width:0}
.sig{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.5;margin:0}
@media (max-width:520px){.facts{grid-template-columns:minmax(0,1fr);gap:2px}.facts dd{margin-bottom:10px}}

/* matching */
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px 16px;align-items:start}
.match h3{font-size:13px;font-weight:500;color:var(--muted)}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:15px;line-height:1.45;min-height:48px}
.tile .fn{font-size:14.5px}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.ok{border-color:var(--good);background:var(--good-bg);cursor:default}
.tile.no{border-color:var(--bad);background:var(--bad-bg)}
.tile .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--good);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
@media (max-width:600px){.match{grid-template-columns:minmax(0,1fr)}}

/* quiz */
.q{font-size:18px;font-weight:600;line-height:1.5;max-width:62ch;text-wrap:pretty}
.quote{font-size:17px;border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;max-width:62ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:15.5px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .key{flex:none;width:24px;height:24px;border-radius:5px;background:var(--surface-2);font-size:13px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.opt span:last-child{min-width:0}
.opt:disabled{cursor:default}
.opt.is-ok{border-color:var(--good);background:var(--good-bg)}
.opt.is-ok .key{background:var(--good);color:var(--surface)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-bad .key{background:var(--bad);color:var(--surface)}
.verdict{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;max-width:68ch}
.verdict.ok{background:var(--good-bg)} .verdict.no{background:var(--bad-bg)}
.verdict b.ok{color:var(--good)} .verdict b.no{color:var(--bad)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:18px;height:6px;border-radius:3px;background:var(--surface-2)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--accent)}
.big{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.2}
.review{display:flex;flex-direction:column;gap:10px;padding-left:0;list-style:none}
.review li{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.review .a{color:var(--good);font-weight:600}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:680px){.lab{grid-template-columns:minmax(0,1fr)}}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:14px;font-weight:600;color:var(--muted)}
.missions{display:flex;flex-wrap:wrap;gap:8px}
.goal{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.goal.done{border:1px solid var(--good);background:var(--good-bg)}
.tbl-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;font-weight:500;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted)}
.field select,.field input{padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);width:100%;min-width:0}
.log{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;max-height:330px;overflow-y:auto}
.log li{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-family:var(--mono);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.log .emit{color:var(--event)} .log .rev{color:var(--bad)}
.log li.empty{font-family:var(--body);color:var(--muted);border-style:dashed;font-size:14px}

/* progress */
.st{font-size:12.5px;font-weight:600;white-space:nowrap}
.st-done{color:var(--good)} .st-weak{color:var(--bad)} .st-mid{color:var(--accent)} .st-new{color:var(--muted)}
.confirm{border:1px solid var(--bad);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <p class="eyebrow">შენი კონსპექტის მიხედვით · 4 დონე</p>
      <h1>ERC-20 ფუნქციების ტრენაჟორი</h1>
    </div>
    <div class="meter" id="meter" aria-live="polite"></div>
  </header>

  <div class="levels" id="levels" role="group" aria-label="დონე"></div>

  <div class="modes-scroll"><div class="modes" id="modes" role="tablist" aria-label="რეჟიმი"></div></div>
  <p class="hint" id="hint"></p>

  <main class="stage" id="stage"></main>

  <div class="legend" aria-label="ფერების მნიშვნელობა">

    <span><span class="pill k-event">ივენთი</span> ჩანაწერი ბლოკჩეინის ჟურნალში</span>
    <span><span class="pill k-guard">მექანიზმი</span> მოდიფიკატორი ან შემოწმება</span>
  </div>
</div>

<script>
(function(){
'use strict';

/* ───────────── data: functions, from the notes (chapters 3–7 and the table in chapter 9) ───────────── */
const WHO={
  any:'ნებისმიერს',
  self:'ნებისმიერს, მაგრამ მხოლოდ საკუთარ ტოკენებზე, ლიმიტზე ან ხმაზე',
  spender:'მას, ვისაც მფლობელმა საკმარისი allowance მისცა',

};
const KIND={view:'წამკითხავი',write:'შემცვლელი',event:'ივენთი',guard:'მექანიზმი'};
const LEVELS=[
  {id:0,t:'ყველა'},
  {id:1,t:'სავალდებულო'},
  {id:2,t:'დამატებითი'},
  {id:3,t:'თავდაცვა'},
  {id:4,t:'ნდობა'}
];

const IT=[
 /* level 1: mandatory + metadata */
 {id:'totalSupply',lv:1,k:'view',n:'totalSupply()',ref:'თავი 3.3',wc:'any',
  sig:'function totalSupply() external view returns (uint256)',
  short:'აბრუნებს არსებული ტოკენების ჯამს',
  does:'აბრუნებს ამჟამად არსებული ტოკენების სრულ რაოდენობას, უმცირეს ერთეულებში.',
  who:'ნებისმიერს',
  note:'იზრდება mint-ის დროს და მცირდება burn-ის დროს. ჩვეულებრივი გადარიცხვა მას არ ცვლის.'},
 {id:'balanceOf',lv:1,k:'view',n:'balanceOf(account)',ref:'თავი 3.3',wc:'any',
  sig:'function balanceOf(address account) external view returns (uint256)',
  short:'აბრუნებს მისამართის ბალანსს',
  does:'აბრუნებს, რამდენი ტოკენი აქვს მითითებულ მისამართს.',
  who:'ნებისმიერს, ნებისმიერი მისამართისთვის',
  note:'საფულე სწორედ ამ ფუნქციით აჩვენებს შენს ბალანსს. ბალანსები საჯაროა.'},
 {id:'allowance',lv:1,k:'view',n:'allowance(owner, spender)',ref:'თავი 3.3',wc:'any',
  sig:'function allowance(address owner, address spender) external view returns (uint256)',
  short:'აბრუნებს დამხარჯავის დარჩენილ ლიმიტს',
  does:'აბრუნებს, რამდენი ტოკენის დახარჯვის უფლება აქვს ჯერ კიდევ `spender`-ს `owner`-ის ბალანსიდან.',
  who:'ნებისმიერს',
  note:'allowance ტოკენებს არ ბლოკავს და ბალანსისგან დამოუკიდებელია: 10 ტოკენით 1000-ის ლიმიტსაც გასცემ.'},
 {id:'transfer',lv:1,k:'write',n:'transfer(to, amount)',ref:'თავი 3.4',wc:'self',
  sig:'function transfer(address to, uint256 amount) external returns (bool)',
  short:'აგზავნის გამომძახებლის საკუთარ ტოკენებს',
  does:'გადარიცხავს `amount` ტოკენს გამომძახებლის ბალანსიდან `to` მისამართზე.',

  short:'ადგენს დამხარჯავის ლიმიტს',

  who:'ნებისმიერს (ადგენს მხოლოდ საკუთარ ლიმიტს)',
  ev:'Approval(msg.sender, spender, amount)',
  note:'ძველ ლიმიტს ახლით ანაცვლებს და არ უმატებს. ტოკენები ამ დროს არსად გადადის.'},
 {id:'transferFrom',lv:1,k:'write',n:'transferFrom(from, to, amount)',ref:'თავი 3.4',wc:'spender',
  sig:'function transferFrom(address from, address to, uint256 amount) external returns (bool)',
  short:'აგზავნის სხვის ტოკენებს ლიმიტის ფარგლებში',
  does:'გადარიცხავს `amount` ტოკენს `from`-ის ბალანსიდან `to`-ზე, გამომძახებლისთვის მიცემული ლიმიტის ფარგლებში, და ამ ლიმიტს ამცირებს.',

/* ───────────── helpers ───────────── */
const $=s=>document.querySelector(s);
function rich(parent,str){
  String(str).split('`').forEach((part,i)=>{
    if(!part) return;
    if(i%2){const c=document.createElement('code');c.textContent=part;parent.appendChild(c);}
    else parent.appendChild(document.createTextNode(part));
  });
  return parent;
}
function el(tag,cls,kids){
  const e=document.createElement(tag);
  if(cls) e.className=cls;
  add(e,kids);
  return e;
}
function add(e,k){
  if(k==null) return;
  if(Array.isArray(k)) k.forEach(x=>add(e,x));
  else if(k instanceof Node) e.appendChild(k);
  else rich(e,k);
}
function btn(label,cls,fn){const b=el('button','btn'+(cls?' '+cls:''),label);b.type='button';b.addEventListener('click',fn);return b;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pill(k){return el('span','pill k-'+k,KIND[k]);}
function fnName(it){const s=el('span','fn k-'+it.k);s.textContent=it.n;return s;}

const KEY='erc20-trainer-v1';
let S={st:{},lv:1,mode:'cards'};
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&typeof p==='object'){S.st=p.st||{};S.lv=[0,1,2,3,4].includes(p.lv)?p.lv:1;S.mode=p.mode||'cards';}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function st(id){return S.st[id]||{ok:0,bad:0,miss:0,streak:0};}
function record(id,ok){
  if(!id) return;
  const s=Object.assign({},st(id));
  if(ok){s.ok++;s.streak++;s.miss=Math.max(0,s.miss-1);}
  else{s.bad++;s.streak=0;s.miss=Math.min(3,s.miss+1);}
  S.st[id]=s;save();
}
function status(id){
  const s=st(id);
  if(s.ok+s.bad===0) return 'new';
  if(s.miss>0) return 'weak';
  if(s.streak>=2) return 'done';
  return 'mid';
}
const ST_LABEL={new:'ახალი',weak:'სუსტი',mid:'მუშავდება',done:'ნასწავლი'};
function weight(id){
  const s=st(id);
  if(s.ok+s.bad===0) return 1.6;
  return Math.max(0.2,1+2*s.miss-0.3*Math.min(s.streak,3));
}
function weightedOrder(arr,key){
  return arr.map(x=>({x,r:Math.pow(Math.random(),1/weight(key?key(x):x.id))})).sort((a,b)=>b.r-a.r).map(o=>o.x);
}
function pool(){return S.lv===0?IT:IT.filter(x=>x.lv===S.lv);}
function scPool(){return S.lv===0?SC:SC.filter(x=>x.lv===S.lv);}

let deck=null,di=0,flipped=false,cardScore={ok:0,no:0};
function buildDeck(){
  const p=pool();
  deck=p.every(x=>status(x.id)==='new')?p.slice():weightedOrder(p);
  di=0;flipped=false;cardScore={ok:0,no:0};
}
function factRows(it){
  const rows=[];
  const lbl=it.lv===3?'რას აკეთებს':(it.k==='event'&&it.lv<3?'რას აღნიშნავს':'რას აკეთებს');
  rows.push([lbl,it.does]);
  if(it.pro) rows.push(['რისგან იცავს',it.pro]);
  if(it.gives) rows.push(['რა გარანტიას იძლევა',it.gives]);
  if(it.typ) rows.push(['ტიპი',it.typ]);
  if(it.who) rows.push(['ვის შეუძლია გამოძახება',it.who]);
  if(it.ev) rows.push(['ივენთი','`'+it.ev+'`']);
  else if(it.lv<=2&&it.k==='view') rows.push(['ივენთი','არ უშვებს']);
  if(it.note) rows.push(['გაითვალისწინე',it.note]);
  return rows;
}
function facts(it){
  const dl=el('dl','facts');

}

/* ───────────── matching ───────────── */
let mt=null;
function pairText(it){return it.lv===3?it.pro:it.lv===4?it.gives:it.short;}
function pairHead(){return S.lv===3?'რისგან იცავს':S.lv===4?'რა გარანტიას იძლევა':S.lv===0?'აღწერა':'რას აკეთებს';}
function buildMatch(){
  const picked=[],names=new Set(),texts=new Set();
  weightedOrder(pool()).forEach(it=>{
    if(picked.length>=5) return;
    const t=pairText(it);
    if(names.has(it.n)||texts.has(t)) return;
    names.add(it.n);texts.add(t);picked.push(it);
  });
  mt={left:shuffle(picked),right:shuffle(picked),sel:null,done:{},order:[],errs:{},flash:null};
}
function renderMatch(stage){
  if(!mt) buildMatch();
  const total=mt.left.length,matched=mt.order.length;
  const top=el('div','row between');
  top.appendChild(el('span','count','დაწყვილებულია '+matched+' / '+total));
  top.appendChild(btn('ახალი რაუნდი','small',()=>{buildMatch();render();}));
  stage.appendChild(top);
  const grid=el('div','match');
  const cl=el('div','col'),cr=el('div','col');
  cl.appendChild(el('h3',null,'ფუნქცია ან მექანიზმი'));
  cr.appendChild(el('h3',null,pairHead()));
  function tile(it,side){
    const t=el('button','tile');t.type='button';
    const isDone=mt.done[it.id];
    if(isDone){t.classList.add('ok');t.disabled=true;const n=el('span','num');n.textContent=String(mt.order.indexOf(it.id)+1);t.appendChild(n);}
    if(mt.sel&&mt.sel.side===side&&mt.sel.id===it.id) t.classList.add('sel');
    if(mt.flash&&mt.flash[side]===it.id) t.classList.add('no');
    const body=el('span');
    if(side==='L') body.appendChild(fnName(it)); else rich(body,pairText(it));
    t.appendChild(body);
    t.addEventListener('click',()=>pick(it,side));
    return t;
  }
  mt.left.forEach(it=>cl.appendChild(tile(it,'L')));
  mt.right.forEach(it=>cr.appendChild(tile(it,'R')));
  grid.appendChild(cl);grid.appendChild(cr);stage.appendChild(grid);
  if(matched===total){
    const clean=mt.left.filter(it=>!mt.errs[it.id]).length;
    const v=el('div','verdict ok');
    const b=el('b','ok');b.textContent='რაუნდი დასრულდა';v.appendChild(b);
    v.appendChild(el('span',null,total+'-დან '+clean+' პირველივე ცდაზე დააწყვილე.'));
    stage.appendChild(v);
    const r=el('div','row');const nb=btn('შემდეგი რაუნდი','primary',()=>{buildMatch();render();});r.appendChild(nb);
    r.appendChild(btn('გადადი ქვიზზე','',()=>{S.mode='quiz';save();render();}));
    stage.appendChild(r);
  }
}
function pick(it,side){
  mt.flash=null;
  if(!mt.sel||mt.sel.side===side){mt.sel={side,id:it.id};render();return;}
  const L=side==='L'?it.id:mt.sel.id,R=side==='R'?it.id:mt.sel.id;
  if(L===R){
    mt.done[L]=true;mt.order.push(L);record(L,!mt.errs[L]);mt.sel=null;
  }else{
    mt.errs[L]=(mt.errs[L]||0)+1;mt.flash={L:L,R:R};mt.sel=null;
  }
  render();
}

/* ───────────── quiz ───────────── */
let qz=null,weakOnly=false;
function distinct(list,keyFn,exclude,n){
  const out=[],seen=new Set([exclude]);
  shuffle(list).forEach(x=>{const k=keyFn(x);if(k&&!seen.has(k)&&out.length<n){seen.add(k);out.push(k);}});
  return out;
}
function pickOthers(it,field,n){
  let out=distinct(IT.filter(x=>x.lv===it.lv&&x.id!==it.id),x=>x[field],it[field],n);
  if(out.length<n){
    const more=distinct(IT.filter(x=>x.lv!==it.lv),x=>x[field],it[field],n*3).filter(v=>!out.includes(v));
    out=out.concat(more.slice(0,n-out.length));
  }
  return out;
}
function makeItemQ(it){
  const types=[];
  if(it.lv<=2){
    types.push('n2s','s2n');
    if(it.wc) types.push('who');
    if(it.k==='write'&&it.ev) types.push('ev');
    if(it.k==='view'||it.k==='write') types.push('kind');
  }else if(it.lv===3){types.push('n2p','p2n');}
  else{types.push('n2g','g2n');}
  const t=types[Math.floor(Math.random()*types.length)];
  const explain=it.does+(it.note?' '+it.note:'');
  const base={key:it.id,item:it.id,ref:it.ref,explain};
  const N='`'+it.n+'`';
  let q;
  switch(t){
    case 'n2s': q={prompt:'რას აკეთებს '+N+'?',opts:[it.short].concat(pickOthers(it,'short',3)),right:it.short};break;
    case 's2n': q={prompt:'რომელზეა საუბარი?',quote:it.short,opts:[it.n].concat(pickOthers(it,'n',3)),right:it.n,code:true};break;
    case 'who': {
      const others=shuffle(Object.keys(WHO).filter(k=>k!==it.wc)).slice(0,3).map(k=>WHO[k]);
      q={prompt:'ვის შეუძლია '+N+'-ის გამოძახება?',opts:[WHO[it.wc]].concat(others),right:WHO[it.wc],explain:'კონსპექტში: '+it.who+'. '+it.does};break;}
    case 'ev': {
      const others=distinct(IT.filter(x=>x.k==='write'&&x.ev&&x.lv<=2),x=>x.ev,it.ev,2);
      q={prompt:'რომელ ივენთს უშვებს '+N+'?',opts:[it.ev].concat(others,['არ უშვებს ივენთს']),right:it.ev,code:true,
         explain:'უშვებს `'+it.ev+'`-ს. '+(it.note||it.does)};break;}
    case 'kind': {
      const a='წამკითხავი (`view`): არაფერს ცვლის, გარედან გამოძახება უფასოა';
      const b='შემცვლელი: ცვლის მდგომარეობას, საჭიროებს ტრანზაქციას და gas-ს';
      q={prompt:N+' წამკითხავია თუ შემცვლელი?',opts:[a,b],right:it.k==='view'?a:b,noShuffle:true};break;}
    case 'n2p': q={prompt:'რისგან იცავს '+N+'?',opts:[it.pro].concat(pickOthers(it,'pro',3)),right:it.pro};break;
    case 'p2n': q={prompt:'რომელი მექანიზმი იცავს ამისგან?',quote:it.pro,opts:[it.n].concat(pickOthers(it,'n',3)),right:it.n,code:true};break;
    case 'n2g': q={prompt:'რა გარანტიას აძლევს მომხმარებელს '+N+'?',opts:[it.gives].concat(pickOthers(it,'gives',3)),right:it.gives};break;
    default: q={prompt:'რომელი იძლევა ამ გარანტიას?',quote:it.gives,opts:[it.n].concat(pickOthers(it,'n',3)),right:it.n,code:true};
  }

function makeScQ(sc){
  return {key:sc.id,item:sc.it||null,ref:sc.ref,prompt:sc.q,codeBlock:sc.code||null,opts:shuffle(sc.o),right:sc.o[0],explain:sc.e};
}
function buildQuiz(){
  let items=pool(),scs=scPool();
  if(weakOnly){items=items.filter(x=>status(x.id)==='weak');scs=scs.filter(x=>status(x.id)==='weak');}
  const qs=[];
  if(items.length+scs.length===0){qz={empty:true};return;}
  const scOrder=weightedOrder(scs),itOrder=[];
  let guard=0;
  while(itOrder.length<10&&items.length&&guard++<60){
    weightedOrder(items).forEach(it=>{if(itOrder.length<10&&itOrder[itOrder.length-1]!==it) itOrder.push(it);});
  }
  const n=Math.min(10,weakOnly?Math.max(items.length+scs.length,3):10);
  let si=0,ii=0;
  for(let i=0;i<n;i++){
    const wantSc=scOrder.length>si&&(itOrder.length<=ii||i%5===2||i%5===4);
    if(wantSc) qs.push(makeScQ(scOrder[si++]));
    else if(itOrder.length>ii) qs.push(makeItemQ(itOrder[ii++]));
  }
  qz={qs,i:0,picked:null,res:[]};
}
function renderQuiz(stage){

  }
}
function answer(o){

function freshChain(){return {bal:{ana:100,beka:0,gio:0},alw:{},total:100,owner:'ana',log:[],lastRevert:null};}
function alw(c,o,s){return (c.alw[o]&&c.alw[o][s])||0;}
function startMission(id){lab={m:id,c:freshChain(),done:false};}
function callFn(c,sender,fn,a){
  const snap=JSON.stringify({bal:c.bal,alw:c.alw,total:c.total});
  const events=[];
  const amt=a.amount;
  function move(from,to,n){
    if(c.bal[from]<n) throw new Error('ERC20: insufficient balance');
    c.bal[from]-=n;c.bal[to]+=n;events.push('Transfer('+ACCN[from]+', '+ACCN[to]+', '+n+')');
  }
  let callText;
  try{
    if(fn==='transfer'){callText='transfer('+ACCN[a.to]+', '+amt+')';move(sender,a.to,amt);}
    else if(fn==='approve'){callText='approve('+ACCN[a.spender]+', '+amt+')';
      (c.alw[sender]=c.alw[sender]||{})[a.spender]=amt;events.push('Approval('+ACCN[sender]+', '+ACCN[a.spender]+', '+amt+')');}
    else if(fn==='transferFrom'){callText='transferFrom('+ACCN[a.from]+', '+ACCN[a.to]+', '+amt+')';
      const cur=alw(c,a.from,sender);
      if(cur<amt) throw new Error('ERC20: insufficient allowance');
      (c.alw[a.from]=c.alw[a.from]||{})[sender]=cur-amt;
      move(a.from,a.to,amt);}
    else if(fn==='mint'){callText='mint('+ACCN[a.to]+', '+amt+')';
      if(sender!==c.owner) throw new Error('Ownable: caller is not the owner');
      c.total+=amt;c.bal[a.to]+=amt;events.push('Transfer(address(0), '+ACCN[a.to]+', '+amt+')');}
    else{callText='burn('+amt+')';
      if(c.bal[sender]<amt) throw new Error('ERC20: insufficient balance');
      c.bal[sender]-=amt;c.total-=amt;events.push('Transfer('+ACCN[sender]+', address(0), '+amt+')');}
    c.log.unshift({who:ACCN[sender],call:callText,events});
    c.lastRevert=null;
  }catch(e){
    const s=JSON.parse(snap);c.bal=s.bal;c.alw=s.alw;c.total=s.total;
    c.log.unshift({who:ACCN[sender],call:callText,revert:e.message});
    c.lastRevert={fn,msg:e.message};
  }
}

  }
  const w=el('div','tbl-scroll');const t=el('table');
  const hr=el('tr');['ფუნქცია ან მექანიზმი','სწორი','შეცდომა','სტატუსი'].forEach((h,i)=>hr.appendChild(el('th',i===1||i===2?'n':null,h)));t.appendChild(hr);
  rows.forEach(it=>{
    const s=st(it.id),stt=status(it.id);
    const tr=el('tr');
    const td=el('td');td.appendChild(fnName(it));tr.appendChild(td);
    const a=el('td','n');a.textContent=String(s.ok);tr.appendChild(a);
    const b=el('td','n');b.textContent=String(s.bad);tr.appendChild(b);
    const c=el('td');const sp=el('span','st st-'+stt);sp.textContent=ST_LABEL[stt];c.appendChild(sp);tr.appendChild(c);
    t.appendChild(tr);
  });
  w.appendChild(t);stage.appendChild(w);
}

/* ───────────── render loop ───────────── */
function resetModes(){deck=null;mt=null;qz=null;weakOnly=false;}
function render(){
  renderChrome();
  const stage=$('#stage');stage.textContent='';
  if(S.mode==='cards') renderCards(stage);
  else if(S.mode==='match') renderMatch(stage);
  else if(S.mode==='quiz') renderQuiz(stage);
  else if(S.mode==='lab') renderLab(stage);
  else renderStats(stage);
}
document.addEventListener('keydown',e=>{
  if(S.mode!=='quiz'||!qz||qz.empty||qz.i>=qz.qs.length||qz.picked!==null) return;
  if(e.target&&/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k=Number(e.key);
  if(k>=1&&k<=qz.qs[qz.i].opts.length){e.preventDefault();answer(qz.qs[qz.i].opts[k-1]);}
});
if(!MODES.some(m=>m.id===S.mode)) S.mode='cards';
render();
})();
</script>
